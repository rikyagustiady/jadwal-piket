<!DOCTYPE html>
<html>
<head>
    <title>Jadwal Piket Maret 2026</title>
    <style>
        body {font-family: Arial; background:#f2f2f2; text-align:center;}
        table {margin:auto; border-collapse: collapse; width:98%;}
        th, td {border:1px solid #333; padding:6px; font-size:14px;}
        th {background:#27ae60; color:white;}
        .libur {background:#ffb3b3;}
        .bulan {background:#34495e; color:white; font-weight:bold;}
        button {padding:4px 8px; background:#3498db; color:white; border:none; cursor:pointer;}
        #rekap {margin-top:30px; font-size:18px;}
        .hapusBtn{background:red;margin-bottom:10px;}
        .editNama{background:#fff3cd; cursor:text;}
        .editCatatan{background:#d1ecf1; cursor:text;}
    </style>
</head>
<body>

<h1>JADWAL PIKET MARET 2026</h1>

<table id="jadwal">
<tr>
<th>Tanggal</th>
<th>Hari</th>
<th>Keterangan</th>
<th>Nama (bisa diedit)</th>
<th>Absen</th>
<th>Catatan</th>
</tr>
</table>

<h2>DATA ABSEN</h2>
<button class="hapusBtn" onclick="hapusAbsen()">Hapus Data Absen</button>
<ul id="dataAbsen"></ul>

<div id="rekap"></div>

<script>
let daftarNama=["Koptu Karim","Serka Riky","Serma Totok","Serka Ibnu","Sertu Manik","Sertu Fariz"];
let libur2026={
"2026-03-18":"Cuti Bersama Nyepi",
"2026-03-19":"Hari Suci Nyepi",
"2026-03-20":"Cuti Bersama Idul Fitri",
"2026-03-21":"Hari Raya Idul Fitri",
"2026-03-22":"Cuti Bersama Idul Fitri",
"2026-03-23":"Cuti Bersama Idul Fitri",
"2026-03-24":"Cuti Bersama Idul Fitri"
};

let tabel=document.getElementById("jadwal");

function format(t){
 return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,'0')+"-"+String(t.getDate()).padStart(2,'0');
}

// Ambil data nama & catatan dari localStorage
let savedNama = JSON.parse(localStorage.getItem("namaPiket")||"[]");
let savedCatatan = JSON.parse(localStorage.getItem("catatanPiket")||"[]");
let savedIndex = 0;

// BULAN MARET
let b = 2; // Maret
let rb = tabel.insertRow();
rb.className = "bulan";
rb.insertCell(0).colSpan = 6;
rb.cells[0].innerHTML = "BULAN MARET 2026";

// Hitung jumlah hari Maret
let jumlahHari = new Date(2026, b+1, 0).getDate();
let noNama = 0;

for(let d=1; d<=jumlahHari; d++){
    let tgl = new Date(2026,b,d);
    let hari = tgl.getDay();
    let tglStr = format(tgl);

    let tr = tabel.insertRow();
    tr.insertCell(0).innerHTML = tglStr;
    tr.insertCell(1).innerHTML = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"][hari];

    if(libur2026[tglStr]){
        tr.className="libur";
        tr.insertCell(2).innerHTML = libur2026[tglStr];
        tr.insertCell(3).innerHTML = "-";
        tr.insertCell(4).innerHTML = "-";
        tr.insertCell(5).innerHTML = "-";
    } else if(hari==0 || hari==6){
        tr.className="libur";
        tr.insertCell(2).innerHTML = "Libur Akhir Pekan";
        tr.insertCell(3).innerHTML = "-";
        tr.insertCell(4).innerHTML = "-";
        tr.insertCell(5).innerHTML = "-";
    } else {
        tr.insertCell(2).innerHTML = "-";

        // Nama piket
        let namaCell = tr.insertCell(3);
        let orang = daftarNama[noNama % daftarNama.length];
        noNama++;
        namaCell.innerText = savedNama[savedIndex] || orang;
        namaCell.contentEditable = true;
        namaCell.className = "editNama";

        // Catatan
        let catCell = tr.insertCell(5);
        catCell.innerText = savedCatatan[savedIndex] || "";
        catCell.contentEditable = true;
        catCell.className = "editCatatan";

        savedIndex++;

        // Event listener
        namaCell.addEventListener("input", ()=>{ hitungRekap(); simpanData(); });
        catCell.addEventListener("input", simpanData);

        tr.insertCell(4).innerHTML = "<button onclick='absen(this)'>Absen</button>";
    }
}

function absen(btn){
    let row = btn.parentElement.parentElement;
    let nama = row.cells[3].innerText.trim();
    if(nama=="") return alert("Nama belum diisi!");
    if(confirm("Absen atas nama "+nama+"?")){
        let w = new Date().toLocaleString();
        let list = JSON.parse(localStorage.getItem("absenData")||"[]");
        list.push(nama+" hadir "+w);
        localStorage.setItem("absenData", JSON.stringify(list));
        tampilkan();
    }
}

function tampilkan(){
    let d = document.getElementById("dataAbsen");
    d.innerHTML = "";
    let list = JSON.parse(localStorage.getItem("absenData")||"[]");
    list.forEach(x=>{
        let li = document.createElement("li");
        li.textContent = x;
        d.appendChild(li);
    });
}

function hapusAbsen(){
    if(confirm("Yakin hapus semua data absen?")){
        localStorage.removeItem("absenData");
        tampilkan();
    }
}

function hitungRekap(){
    let rekap = {};
    document.querySelectorAll(".editNama").forEach(cell=>{
        let n = cell.innerText.trim();
        if(n!=""){
            if(!rekap[n]) rekap[n] = 0;
            rekap[n]++;
        }
    });
    let divRekap = document.getElementById("rekap");
    divRekap.innerHTML = "<h2>REKAP PIKET MARET 2026</h2>";
    for(let n in rekap){
        divRekap.innerHTML += n+" : "+rekap[n]+" kali<br>";
    }
}

function simpanData(){
    let namaData = [];
    let catatanData = [];
    document.querySelectorAll(".editNama").forEach(cell=> namaData.push(cell.innerText.trim()));
    document.querySelectorAll(".editCatatan").forEach(cell=> catatanData.push(cell.innerText.trim()));
    localStorage.setItem("namaPiket", JSON.stringify(namaData));
    localStorage.setItem("catatanPiket", JSON.stringify(catatanData));
}

tampilkan();
hitungRekap();
</script>

</body>
</html>
