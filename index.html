<!DOCTYPE html>
<html>
<head>
    <title>Jadwal Piket Bulanan</title>
    <style>
        body {font-family: Arial; background:#f2f2f2; text-align:center;}
        h1 {color:#2c3e50;}
        table {margin:auto; border-collapse: collapse; width:90%;}
        th, td {border:1px solid #333; padding:8px;}
        th {background:#27ae60; color:white;}
    </style>
</head>
<body>

<h1>JADWAL PIKET BULANAN</h1>

<table>
<tr>
<th>Tanggal</th>
<th>Nama</th>
</tr>

<script>
let nama = ["Karim","Riky","Ibnu","Manik","Fariz"];
let hari = 30;
for(let i=1;i<=hari;i++){
    document.write("<tr><td>"+i+"</td><td>"+nama[i%nama.length]+"</td></tr>");
}
</script>

</table>

</body>
</html>
