<!DOCTYPE html>
<html>
<head>
    <title>Jadwal Piket + Absen Permanen</title>
    <style>
        body {font-family: Arial; background:#f2f2f2; text-align:center;}
        h1 {color:#2c3e50;}
        table {margin:auto; border-collapse: collapse; width:95%;}
        th, td {border:1px solid #333; padding:8px;}
        th {background:#27ae60; color:white;}
        button {padding:5px 10px; background:#3498db; color:white; border:none; cursor:pointer;}
        #reset {background:red;}
    </style>
</head>
<body>

<h1>JADWAL PIKET + ABSEN ONLINE</h1>

<table id="jadwal">
<tr>
<th>Tanggal</th>
<th>Nama</th>
<th>Absen</th>
</tr>
</table>

<h2>📋 DATA ABSEN</h2>
<ul id="dataAbsen"></ul>
<button id="reset" onclick="resetAbsen()">Hapus Semua Absen</button>

<script>
let nama = ["Karim","Riky","Ibnu","Manik","Fariz"];
let hari = 30;
let tabel = document.getElementById("jadwal");

for(let i=1;i<=hari;i++){
    let baris = tabel.insertRow();
    baris.insertCell(0).innerHTML = i;
    baris.insertCell(1).innerHTML = nama[i%nama.length];
    baris.insertCell(2).innerHTML = "<button onclick='absen(\""+nama[i%nama.length]+"\")'>Hadir</button>";
}

function absen(nama){
    let waktu = new Date().toLocaleString();
    let list = JSON.parse(localStorage.getItem("absenData") || "[]");
    list.push(nama + " hadir jam " + waktu);
    localStorage.setItem("absenData", JSON.stringify(list));
    tampilkan();
}

function tampilkan(){
    let dataList = document.getElementById("dataAbsen");
    dataList.innerHTML = "";
    let list = JSON.parse(localStorage.getItem("absenData") || "[]");
    list.forEach(item=>{
        let li = document.createElement("li");
        li.textContent = item;
        dataList.appendChild(li);
    });
}

function resetAbsen(){
    localStorage.removeItem("absenData");
    tampilkan();
}

tampilkan();
</script>

</body>
</html>
