<!DOCTYPE html>
<html>
<head>
    <title>Jadwal Piket 2026</title>
    <style>
        body {font-family: Arial; background:#f2f2f2; text-align:center;}
        table {margin:auto; border-collapse: collapse; width:98%;}
        th, td {border:1px solid #333; padding:6px; font-size:14px;}
        th {background:#27ae60; color:white;}
        .libur {background:#ffb3b3;}
        .bulan {background:#34495e; color:white; font-weight:bold;}
        button {padding:4px 8px; background:#3498db; color:white; border:none; cursor:pointer;}
        #rekap {margin-top:30px; font-size:18px;}
        .hapusBtn{background:red;margin-bottom:10px;}
    </style>
</head>
<body>

<h1>JADWAL PIKET MARET – DESEMBER 2026</h1>

<table id="jadwal">
<tr>
<th>Tanggal</th>
<th>Hari</th>
<th>Keterangan</th>
<th>Nama</th>
<th>Absen</th>
</tr>
</table>

<h2>DATA ABSEN</h2>
<button class="hapusBtn" onclick="hapusAbsen()">Hapus Data Absen</button>
<ul id="dataAbsen"></ul>

<div id="rekap"></div>

<script>
let daftarNama=["Koptu Karim","Serka Riky","Serma Totok","Serka Ibnu","Sertu Manik","Sertu Fariz"];

let libur2026={
"2026-03-18":"Cuti Bersama Nyepi",
"2026-03-19":"Hari Suci Nyepi",
"2026-03-20":"Cuti Bersama Idul Fitri",
"2026-03-21":"Hari Raya Idul Fitri",
"2026-03-22":"Cuti Bersama Idul Fitri",
"2026-03-23":"Cuti Bersama Idul Fitri",
"2026-03-24":"Cuti Bersama Idul Fitri",
"2026-04-03":"Wafat Yesus Kristus",
"2026-05-01":"Hari Buruh",
"2026-05-14":"Kenaikan Yesus Kristus",
"2026-05-15":"Cuti Bersama Kenaikan Yesus Kristus",
"2026-05-27":"Hari Raya Idul Adha",
"2026-05-28":"Cuti Bersama Idul Adha",
"2026-05-31":"Hari Raya Waisak",
"2026-06-01":"Hari Lahir Pancasila",
"2026-06-16":"Tahun Baru Islam",
"2026-08-17":"Hari Kemerdekaan RI",
"2026-12-24":"Cuti Bersama Natal",
"2026-12-25":"Hari Raya Natal"
};

let tabel=document.getElementById("jadwal");

function format(t){
 return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,'0')+"-"+String(t.getDate()).padStart(2,'0');
}

function acak(arr){
 return arr.sort(()=>Math.random()-0.5);
}

let bulanNama=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

for(let b=2;b<=11;b++){

 let rb=tabel.insertRow();
 rb.className="bulan";
 rb.insertCell(0).colSpan=5;
 rb.cells[0].innerHTML="BULAN "+bulanNama[b].toUpperCase();

 let urutanBulan = acak([...daftarNama]);
 let noNama=0;

 let jumlahHari=new Date(2026,b+1,0).getDate();

 for(let d=1;d<=jumlahHari;d++){
  let tgl=new Date(2026,b,d);
  let hari=tgl.getDay();
  let tglStr=format(tgl);

  let tr=tabel.insertRow();
  tr.insertCell(0).innerHTML=tglStr;
  tr.insertCell(1).innerHTML=["Min","Sen","Sel","Rab","Kam","Jum","Sab"][hari];

  if(libur2026[tglStr]){
   tr.className="libur";
   tr.insertCell(2).innerHTML=libur2026[tglStr];
   tr.insertCell(3).innerHTML="-";
   tr.insertCell(4).innerHTML="-";
  }
  else if(hari==0 || hari==6){
   tr.className="libur";
   tr.insertCell(2).innerHTML="Libur Akhir Pekan";
   tr.insertCell(3).innerHTML="-";
   tr.insertCell(4).innerHTML="-";
  }
  else{
   tr.insertCell(2).innerHTML="-";
   let orang=urutanBulan[noNama%urutanBulan.length];
   noNama++;
   tr.insertCell(3).innerHTML=orang;
   tr.insertCell(4).innerHTML="<button onclick='absen(\""+orang+"\")'>Absen</button>";
  }
 }
}

function absen(nama){
 let konfirmasi=confirm("Absen atas nama "+nama+"?");
 if(konfirmasi){
  let w=new Date().toLocaleString();
  let list=JSON.parse(localStorage.getItem("absenData")||"[]");
  list.push(nama+" hadir "+w);
  localStorage.setItem("absenData",JSON.stringify(list));
  tampilkan();
 }
}

function tampilkan(){
 let d=document.getElementById("dataAbsen");
 d.innerHTML="";
 let list=JSON.parse(localStorage.getItem("absenData")||"[]");
 list.forEach(x=>{
  let li=document.createElement("li");
  li.textContent=x;
  d.appendChild(li);
 });
}

function hapusAbsen(){
 if(confirm("Yakin hapus semua data absen?")){
   localStorage.removeItem("absenData");
   tampilkan();
 }
}

tampilkan();

// ================= REKAP OTOMATIS =================
let rekap={};
daftarNama.forEach(n=>rekap[n]=0);

document.querySelectorAll("#jadwal tr").forEach(row=>{
 let namaCell=row.cells[3];
 if(namaCell && namaCell.textContent!="-"){
   let n=namaCell.textContent;
   if(rekap[n]!==undefined){rekap[n]++;}
 }
});

let divRekap=document.getElementById("rekap");
divRekap.innerHTML="<h2>REKAP PIKET MARET–DESEMBER 2026</h2>";
for(let n in rekap){
 divRekap.innerHTML+=n+" : "+rekap[n]+" kali<br>";
}
</script>

</body>
</html>
